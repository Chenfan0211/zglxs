server {
    listen 18084;
    server_name _;

    root /srv/douyin-order-python/current/frontend;
    index index.html;

    access_log /srv/douyin-order-python/shared/logs/nginx-access.log;
    error_log /srv/douyin-order-python/shared/logs/nginx-error.log;

    location ~* /(?:\.env|.*\.log|.*\.bak|.*\.sql) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location /apiv1/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /internal/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
